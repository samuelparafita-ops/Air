# AIR · configuración de nginx (se copia a /etc/nginx/conf.d/default.conf).
# Caché: el HTML, el CSS y el JS se revalidan siempre (ETag), porque sus nombres no llevan huella;
# fuentes e imágenes se guardan 30 días. Si se cambia una imagen o una fuente, cambiar también su nombre.

map $sent_http_content_type $air_expires {
    default                 off;
    ~*text/html             -1;
    ~*text/css              -1;
    ~*javascript            -1;
    ~*font/                 30d;
    ~*image/                30d;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Dominio canónico sin www. El webhook de n8n del formulario solo admite el origen
    # https://airconsulting.es; desde www el navegador bloqueaba el envío (CORS).
    if ($host = www.airconsulting.es) {
        return 301 https://airconsulting.es$request_uri;
    }

    expires $air_expires;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml text/plain;

    # Cabeceras de seguridad (ninguna location define add_header, así que todas las heredan)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://n8n.airconsulting.es; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    # Por si la versión de nginx no trae AVIF en mime.types
    location ~* \.avif$ {
        default_type image/avif;
    }
}
